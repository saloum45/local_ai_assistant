<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: transparent;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; overflow: hidden; user-select: none;
    -webkit-app-region: drag;
}

.avatar {
    --red: #ff1e3c;
    width: 260px; height: 150px;
    background: radial-gradient(ellipse at 50% 30%, #26262e 0%, #0b0b0e 85%);
    border-radius: 26px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    position: relative;
    animation: float 4s ease-in-out infinite;
}

/* Lignes de scan façon écran */
.avatar::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
}

/* Sourcils */
.brows { position: absolute; top: 32px; display: flex; gap: 30px; transition: transform .25s ease; }
.brow { width: 48px; height: 4px; background: var(--red); border-radius: 2px; box-shadow: 0 0 6px var(--red); }
.brow:first-child { transform: rotate(10deg); }
.brow:last-child  { transform: rotate(-10deg); }

/* Yeux manga : forme effilée, légèrement inclinée */
.eyes { display: flex; gap: 28px; margin-top: 4px; margin-bottom: 16px; }
.eye {
    width: 54px; height: 32px;
    background: #fff;
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    position: relative; overflow: hidden;
    box-shadow: 0 0 12px var(--red), inset 0 6px 0 rgba(0,0,0,.18);
    animation: blink 5s infinite;
}
.eye:first-child { transform: rotate(8deg); }
.eye:last-child  { transform: rotate(-8deg); }

/* Iris rouge avec pupille fendue et reflets */
.iris {
    position: absolute; top: 1px; left: calc(50% - 13px);
    width: 26px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #ff8c9a 0%, #ff1e3c 38%, #7a0016 100%);
    box-shadow: 0 0 8px var(--red);
    animation: scan 5s ease-in-out infinite;
}
.iris::before { /* pupille */
    content: ""; position: absolute; left: 50%; top: 18%; width: 6px; height: 64%;
    transform: translateX(-50%); background: #1a0006; border-radius: 50%;
}
.iris::after { /* reflet */
    content: ""; position: absolute; left: 4px; top: 4px; width: 7px; height: 7px;
    background: #fff; border-radius: 50%; opacity: .95;
}

/* Bouche */
.mouth {
    width: 34px; height: 4px; border-radius: 2px;
    background: var(--red); box-shadow: 0 0 8px var(--red);
    transition: all .2s ease;
}

/* ---------- ÉTATS ---------- */

/* Parle : bouche qui s'agite, halo plus fort */
.speaking .mouth { background: #fff; box-shadow: 0 0 12px #fff; animation: talk .42s ease-in-out infinite; }

/* Écoute : regard fixe droit devant, iris dilatés, aura blanche */
.listening .eye { box-shadow: 0 0 20px #fff, 0 0 10px var(--red); }
.listening .mouth { box-shadow: 0 0 10px #fff; }
.listening .iris { animation: none; transform: scale(1.18); }
.listening .brows { transform: translateY(-4px); }

/* Réfléchit : le regard balaie beaucoup plus vite, sourcils froncés */
.thinking .iris { animation-duration: 1.1s; }
.thinking .brows { transform: translateY(3px); }

/* ---------- KEYFRAMES ---------- */
@keyframes scan { /* gauche -> droite -> gauche */
    0%, 8%   { transform: translateX(-12px); }
    42%, 58% { transform: translateX(12px); }
    92%, 100%{ transform: translateX(-12px); }
}
@keyframes blink {
    0%, 93%, 100% { transform: var(--tilt, none) scaleY(1); }
    96% { transform: var(--tilt, none) scaleY(.08); }
}
@keyframes talk {
    0%   { width: 26px; height: 4px;  border-radius: 2px; }
    25%  { width: 18px; height: 13px; border-radius: 50%; }
    50%  { width: 30px; height: 6px;  border-radius: 4px; }
    75%  { width: 14px; height: 17px; border-radius: 50%; }
    100% { width: 24px; height: 8px;  border-radius: 5px; }
}
@keyframes flame { to { transform: scale(1.04); } }
@keyframes float { 0%,100% { translate: 0 0; } 50% { translate: 0 -4px; } }
@keyframes spin  { to { transform: rotate(360deg); } }

.eye:first-child { --tilt: rotate(8deg); }
.eye:last-child  { --tilt: rotate(-8deg); }

@media (prefers-reduced-motion: reduce) {
    .avatar { animation: none; }
}
</style>
</head>
<body>

<div class="avatar" id="avatar">
    <div class="brows"><div class="brow"></div><div class="brow"></div></div>
    <div class="eyes">
        <div class="eye"><div class="iris"></div></div>
        <div class="eye"><div class="iris"></div></div>
    </div>
    <div class="mouth"></div>
</div>

<script>
const avatar = document.getElementById('avatar');
const toggle = (cls, state) => avatar.classList.toggle(cls, !!state);

window.setSpeaking  = state => toggle('speaking', state);
window.setListening = state => toggle('listening', state);
window.setThinking  = state => toggle('thinking', state);
</script>
</body>
</html>
